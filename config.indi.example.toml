# Copy to ~/.config/onstep_adapter/config.toml on the Raspberry, then review.
# This is for the planned INDI client, not the serial-only 0.3.5 wheel.
[indi]
host = "127.0.0.1"
port = 7624
device = "LX200 OnStep"
safe_meridian_flip_via_home = true
# Remains false until the separate supervised INDI HOME H-status test.
home_motion_enabled = false
# PARK/UNPARK is physically exercised and required by terrestrial transitions.
park_motion_enabled = true
# "strict" requires this client's accepted time/site and HOME authority.
# "controller_managed" permits TRACK_ON from fresh, fault-free OnStep status
# and reports missing authority as warnings for applications that manage it.
tracking_authority_policy = "strict"

[observer]
lat = 50.336
lon = 8.533
alt_m = 304.0

[meridian]
# Operational adapter thresholds, not OnStep firmware guard settings.
flip_request_deg = 1.0
tracking_stop_deg = 1.75
flip_allowance_seconds = 120.0
reserve_seconds = 30.0

[movement]
# Finite RA/DEC jog targets may reach slightly below the geometric horizon
# under direct user observation, but must remain inside these DEC bounds.
min_alt_deg = -2.0
min_dec_deg = -80.0
max_dec_deg = 80.0

[terrestrial]
# Shared local arbitration state for every Python client on this Raspberry.
# A missing/corrupt file makes mode transitions and terrestrial motion fail closed.
state_file = "/home/astro/.config/onstep_adapter/mode_state.json"
# One request is always finite. The adapter never exposes indefinite motion.
step_deg = 10.0
max_step_deg = 10.0
# With movement.min_alt_deg=-2, this leaves a final effective floor of 0 deg.
horizon_margin_deg = 2.0
# Request STOP before the estimated endpoint and wait for stable telemetry.
brake_lead_deg = 0.5
stop_hold_seconds = 3.0
# Standard INDI maximum slew-rate switch used by the supervised v10.22 path.
slew_rate_element = "SLEW_MAX"

[focuser]
# INDI currently reports FOCUS_MAX=100000. Keep this lower conservative
# software ceiling until the physical focuser travel is verified.
max_position = 50000
