# Copy to ~/.config/onstep_adapter/config.toml on the Raspberry, then review.
[indi]
host = "127.0.0.1"
port = 7624
device = "LX200 OnStep"
safe_meridian_flip_via_home = true
home_motion_enabled = false
# "strict" requires this client's accepted time/site and HOME authority.
# "controller_managed" delegates those authorities but retains live hardware
# state, fault, limit and inclusive hard-stop enforcement.
tracking_authority_policy = "strict"

[observer]
lat = 50.336
lon = 8.533
alt_m = 304.0

[meridian]
flip_request_deg = 1.0
tracking_stop_deg = 1.75
flip_allowance_seconds = 120.0
reserve_seconds = 30.0

[movement]
min_alt_deg = -2.0
min_dec_deg = -80.0
max_dec_deg = 80.0

[focuser]
max_position = 50000

[trace]
# Optional transaction trace (JSON Lines) of every INDI write, every received
# property update and every public mount call. {date} becomes the UTC day, so
# every session of a day goes into one file (a session running past midnight
# continues in the next day's file); {utc} becomes the start time instead.
# Compare two traces with: python3 -m onstep_adapter.tools.trace_compare
# Condense a log with:     python3 -m onstep_adapter.tools.trace_consolidate
# path = "~/.local/state/onstep_adapter/trace-{date}.jsonl"
